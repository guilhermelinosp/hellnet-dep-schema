name: validate-schema-pr
on:
  pull_request:
    paths:
      - "schemas/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate all schemas
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh schemas
