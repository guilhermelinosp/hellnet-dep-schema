name: register-apicurio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "schemas/**"

permissions:
  contents: read

jobs:
  find-changed:
    runs-on: arc-runner
    outputs:
      schemas: ${{ steps.list.outputs.schemas }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: List changed schemas
        id: list
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- 'schemas/**/schema.*' || true)
          if [ -z "$changed" ]; then
            echo "has_changed=false" >> $GITHUB_OUTPUT
            echo "No schema changes found"
          else
            dirs=$(echo "$changed" | sed 's|/schema\..*||' | sort -u | jq -R -s -c 'split("\n")[:-1]')
            echo "has_changed=true" >> $GITHUB_OUTPUT
            echo "schemas=$dirs" >> $GITHUB_OUTPUT
            echo "Changed: $dirs"
          fi

  register:
    needs: find-changed
    if: github.actor != 'hellnet-bot' && needs.find-changed.outputs.has_changed == 'true'
    runs-on: arc-runner
    strategy:
      matrix:
        schema: ${{ fromJSON(needs.find-changed.outputs.schemas) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check compatibility
        env:
          APICURIO_URL: ${{ secrets.APICURIO_URL || 'http://192.168.1.254:8085' }}
        run: |
          chmod +x scripts/check-compatibility.sh
          ./scripts/check-compatibility.sh \
            --registry "$APICURIO_URL" \
            --group "default" \
            --schema "${{ matrix.schema }}"

      - name: Register in Apicurio Registry
        env:
          APICURIO_URL: ${{ secrets.APICURIO_URL || 'http://192.168.1.254:8085' }}
          APICURIO_TOKEN: ${{ secrets.APICURIO_TOKEN }}
          GROUP_ID: "default"
        run: |
          chmod +x scripts/register.sh
          ./scripts/register.sh \
            --registry "$APICURIO_URL" \
            --group "$GROUP_ID" \
            --schema "${{ matrix.schema }}"
